<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #headline {
            font-size: 20px;
            text-align: center;
            font: bold;
        }

        #inputBox {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        #CalButton button {
            border: 1px solid black;
            padding: 7px 40px;
            margin: 5px 240px;
            background-color: white;
            cursor: pointer;
            justify-content: center;
        }
        #weight-guide h3, p{
            text-align: center;
        }
        .guide-head {
            text-align: center;
        }
    </style>
</head>

<body>
    <h2 id="headline">BMI Calculator</h2>
    <div>
        <div id="inputBox">
            <p>Height in CM:</p>
            <input type="text" style="height: 10px;" id="height">
        </div>
        <div id="inputBox">
            <p>Weight in KG:</p>
            <input type="text" style="height: 10px;" id="weight">
        </div>
        <div id="CalButton">
            <button>Calculate</button>
        </div>
        <div id="results"></div>
        <div id="Weight-guide">
            <h3 class="guide-head">BMI Weight Guide</h3>
            <p>Under Weight = Less than 18.6</p>
            <p>Normal Range = 18.6 and 24.9</p>
            <p>Overweight = Grather than 24.9</p>
        </div>
    </div>
</body>

</html>
